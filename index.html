<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San - Sistema Nuevo</title>
  <style>
    :root{--bg:#07111f;--panel:#101c2e;--line:#26384f;--text:#eef4ff;--muted:#9fb0c7;--gold:#facc15;--blue:#3b82f6;--green:#22c55e}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif} header{background:#0c192b;border-bottom:1px solid #b78b1d;padding:16px 22px} main{max-width:980px;margin:auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.row:last-child{border:0}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted);font-size:.9rem}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#091525;color:var(--text)}button{border:0;border-radius:8px;padding:9px 12px;color:white;background:var(--blue);cursor:pointer}.gold{background:var(--gold);color:#111827}.green{background:var(--green)}.danger{background:#dc2626}.outline{background:transparent;border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.modal{background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:12px;padding:18px;width:min(440px,92vw)}.modal::backdrop{background:#020617ba}.modal form{display:grid;gap:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#13294b;border:1px solid var(--gold);padding:10px 16px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}
  </style>
</head>
<body>
<header><h1>👑 <span id="appName">San 50,000 (10 Meses)</span></h1><p class="muted">Sistema nuevo — datos locales vacíos</p></header>
<main>
  <section class="grid">
    <div class="card"><span class="muted">Participantes</span><h2 id="participantCount">0</h2></div>
    <div class="card"><span class="muted">Recaudado</span><h2 id="totalPaid">RD$ 0</h2></div>
    <div class="card"><span class="muted">Meta mensual</span><h2 id="monthTarget">RD$ 50,000</h2></div>
  </section>

  <section class="card">
    <div class="row"><h2>Participantes</h2><button class="gold" id="addParticipant">+ Agregar participante</button></div>
    <div id="participantList"></div>
  </section>

  <section class="card">
    <h2>Respaldo</h2>
    <div class="actions"><button class="outline" id="exportData">⬇️ Exportar JSON</button><label class="outline" style="padding:9px 12px;border-radius:8px;cursor:pointer">⬆️ Importar JSON<input id="importData" type="file" accept=".json" hidden></label></div>
  </section>
</main>

<dialog id="participantModal" class="modal">
  <form id="participantForm">
    <h3 id="participantModalTitle">Agregar participante</h3>
    <input id="participantId" type="hidden">
    <label>Número / turno<input id="participantTurn" type="number" min="1" max="36" required></label>
    <label>Nombre<input id="participantName" type="text" required></label>
    <label>Teléfono<input id="participantPhone" type="tel" placeholder="Ej: 8295551234"></label>
    <label>Tipo de número<select id="participantShare"><option value="1">Número completo</option><option value="0.5">Medio número</option></select></label>
    <div class="actions"><button type="button" class="outline" id="cancelParticipant">Cancelar</button><button class="gold" type="submit">Guardar</button></div>
  </form>
</dialog>
<div id="toast" class="toast"></div>

<script>
const STORAGE_KEY='sistema_nuevo_san_v1';
const emptyState=()=>({config:{name:'San 50,000 (10 Meses)',currency:'RD$',quota:2500,months:10,specialDate:'2026-12-15',firstDeliveryDate:'2027-01-15',graceDays:3},participants:[],specialPayments:{},payments:{},deliveries:{}});
let state=loadState();
function loadState(){try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)return JSON.parse(saved)}catch(e){console.error(e)}return emptyState()}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));render()}
function money(v){return `${state.config.currency} ${Number(v||0).toLocaleString('es-DO',{maximumFractionDigits:2})}`}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function closeModal(){document.getElementById('participantModal').close()}
function openParticipant(participant=null){document.getElementById('participantModalTitle').textContent=participant?'Editar participante':'Agregar participante';document.getElementById('participantId').value=participant?.id||'';document.getElementById('participantTurn').value=participant?.turn||state.participants.length+1;document.getElementById('participantName').value=participant?.name||'';document.getElementById('participantPhone').value=participant?.phone||'';document.getElementById('participantShare').value=participant?.share||1;document.getElementById('participantModal').showModal()}
function removeParticipant(id){if(!confirm('¿Eliminar este participante?'))return;state.participants=state.participants.filter(p=>p.id!==id);delete state.specialPayments[id];for(const month of Object.keys(state.payments)){delete state.payments[month]?.[id]}saveState();toast('Participante eliminado')}
function render(){document.getElementById('appName').textContent=state.config.name;document.getElementById('participantCount').textContent=state.participants.length;let paid=0;for(const month of Object.values(state.payments||{}))for(const p of Object.values(month||{}))paid+=Number(p?.amount||0);for(const p of Object.values(state.specialPayments||{}))paid+=Number(p?.amount||0);document.getElementById('totalPaid').textContent=money(paid);document.getElementById('monthTarget').textContent=money(Number(state.config.quota)*20);const list=document.getElementById('participantList');list.innerHTML='';if(!state.participants.length){list.innerHTML='<p class="muted">No hay participantes registrados.</p>';return}state.participants.slice().sort((a,b)=>Number(a.turn)-Number(b.turn)).forEach(p=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<div><strong>#${p.turn} · ${escapeHtml(p.name)}</strong><div class="muted">${p.phone?escapeHtml(p.phone):'Sin teléfono'} · ${p.share===0.5?'Medio número':'Número completo'}</div></div><div class="actions"><button class="outline edit">Editar</button><button class="danger delete">Eliminar</button></div>`;row.querySelector('.edit').onclick=()=>openParticipant(p);row.querySelector('.delete').onclick=()=>removeParticipant(p.id);list.appendChild(row)})}
function escapeHtml(text){const div=document.createElement('div');div.textContent=String(text||'');return div.innerHTML}
document.getElementById('addParticipant').onclick=()=>openParticipant();document.getElementById('cancelParticipant').onclick=closeModal;
document.getElementById('participantForm').onsubmit=e=>{e.preventDefault();const id=document.getElementById('participantId').value;const participant={id:id||crypto.randomUUID(),turn:Number(document.getElementById('participantTurn').value),name:document.getElementById('participantName').value.trim(),phone:document.getElementById('participantPhone').value.trim(),share:Number(document.getElementById('participantShare').value)};if(!participant.name)return;if(id){const i=state.participants.findIndex(p=>p.id===id);if(i>=0)state.participants[i]=participant}else state.participants.push(participant);closeModal();saveState();toast('Participante guardado')};
document.getElementById('exportData').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='san-sistema-nuevo.json';a.click();URL.revokeObjectURL(url);toast('Backup exportado')};
document.getElementById('importData').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!imported.config||!Array.isArray(imported.participants))throw new Error('Formato inválido');if(!confirm('Importar este respaldo reemplazará los datos locales actuales. ¿Continuar?'))return;state=imported;saveState();toast('Datos importados')}catch(err){toast('El archivo JSON no es válido')}finally{e.target.value=''}};
render();
</script>
</body>
</html>
